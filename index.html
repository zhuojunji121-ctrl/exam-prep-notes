<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>备考资料索引</title>
<style>
  :root {
    --page:#f9f9f7; --surface-1:#fcfcfb;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --hairline:rgba(11,11,11,0.10); --gridline:#e1e0d9;
    --accent:#2a78d6;
  }
  :root[data-theme="dark"] {
    --page:#0d0d0d; --surface-1:#1a1a19;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --hairline:rgba(255,255,255,0.10); --gridline:#2c2c2a;
    --accent:#3987e5;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:32px 24px 64px; background:var(--page); color:var(--text-primary);
    font-family:system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;
    font-size:14px; line-height:1.6;
  }
  .wrap { max-width:920px; margin:0 auto; }
  header { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; }
  h1 { font-size:22px; margin:0 0 2px; }
  .sub { color:var(--text-secondary); font-size:13px; }
  button {
    font:inherit; font-size:12px; color:var(--text-secondary); background:var(--surface-1);
    border:1px solid var(--hairline); border-radius:8px; padding:6px 12px; cursor:pointer;
  }
  button:hover { color:var(--text-primary); }
  .stat { color:var(--text-muted); font-size:12px; margin-top:14px; }
  h2 {
    font-size:13px; font-weight:600; color:var(--text-secondary); margin:28px 0 10px;
    padding-bottom:6px; border-bottom:1px solid var(--gridline);
    display:flex; align-items:baseline; gap:8px;
  }
  h2 .n { color:var(--text-muted); font-weight:400; font-size:12px; }
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:720px) { .cards { grid-template-columns:1fr; } }
  a.card {
    display:block; text-decoration:none; color:inherit;
    background:var(--surface-1); border:1px solid var(--hairline); border-radius:12px;
    padding:14px 16px; transition:border-color .15s, transform .15s;
  }
  a.card:hover { border-color:var(--accent); transform:translateY(-1px); }
  .card .t { font-size:15px; font-weight:600; margin-bottom:3px; }
  .card .d { font-size:13px; color:var(--text-secondary); }
  .card .m { font-size:11px; color:var(--text-muted); margin-top:9px; display:flex; gap:10px; align-items:center; }
  .tag { border:1px solid var(--hairline); border-radius:5px; padding:1px 6px; }
  .empty { color:var(--text-muted); font-size:13px; padding:16px 0; }
  footer { margin-top:36px; font-size:12px; color:var(--text-muted); border-top:1px solid var(--gridline); padding-top:12px; }
  code { background:var(--surface-1); border:1px solid var(--hairline); border-radius:4px; padding:1px 5px; font-size:12px; }
  @media (max-width:640px) {
    body { padding:18px 12px 40px; }
    header { flex-direction:column; align-items:stretch; gap:10px; }
    h1 { font-size:19px; }
    footer { word-break:break-all; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>备考资料</h1>
      <div class="sub">按学科归档的复习材料，新内容持续往下加</div>
    </div>
    <button id="themeBtn">切换深色</button>
  </header>
  <div class="stat" id="stat"></div>
  <div id="list"></div>
  <footer>
    新增条目：把文件放进 <code>学科/条目名/index.html</code>，然后在本文件的 <code>ENTRIES</code> 数组里加一条。
  </footer>
</div>

<script>
/* ===== 条目清单：新增内容往这里追加 ===== */
const ENTRIES = [
  {
    subject: '地理',
    title:   '中国地势三级阶梯分界线',
    desc:    '两条界线上的 8 条界山各自位于哪两省交界，含可缩放地图与对照表',
    path:    '地理/三级阶梯分界线/index.html',
    date:    '2026-09-02',
    tags:    ['地图', '区域地理']
  }
];
/* ======================================== */

const SUBJECT_ORDER = ['地理', '历史', '政治', '语文', '数学', '英语', '综合'];

function render() {
  const bySubject = new Map();
  for (const e of ENTRIES) {
    if (!bySubject.has(e.subject)) bySubject.set(e.subject, []);
    bySubject.get(e.subject).push(e);
  }
  const subjects = [...bySubject.keys()].sort((a, b) => {
    const ia = SUBJECT_ORDER.indexOf(a), ib = SUBJECT_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });

  document.getElementById('stat').textContent =
    ENTRIES.length ? `共 ${ENTRIES.length} 份 · ${subjects.length} 个学科` : '';

  const list = document.getElementById('list');
  if (!ENTRIES.length) {
    list.innerHTML = '<div class="empty">还没有内容。</div>';
    return;
  }
  list.innerHTML = subjects.map(s => {
    const items = bySubject.get(s).sort((a, b) => b.date.localeCompare(a.date));
    return `<h2>${s}<span class="n">${items.length}</span></h2><div class="cards">` +
      items.map(e => `
        <a class="card" href="${e.path}">
          <div class="t">${e.title}</div>
          <div class="d">${e.desc}</div>
          <div class="m"><span>${e.date}</span>${(e.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}</div>
        </a>`).join('') +
      `</div>`;
  }).join('');
}
render();

const btn = document.getElementById('themeBtn');
btn.addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  btn.textContent = dark ? '切换深色' : '切换浅色';
});
</script>
</body>
</html>
